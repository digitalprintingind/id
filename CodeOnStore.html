        function deleteTransaction(id) {

        function checkoutWhatsApp() {
            if(cart.length === 0) return; 
            
            // Format Data Transaksi
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const trxId = 'TRX-' + Date.now();
            
            // Nama Toko Dinamis dari Profil
            const storeName = profile.name || '';

            let text = `*Halo Admin ${storeName}!*  \nSaya ingin memproses pesanan berikut:\n\n`;
            text += `*No. TRX:* ${trxId}\n`;
            text += `*Waktu:* ${dateStr}\n\n`;

            let total = 0;
            cart.forEach((item, index) => { 
                text += `*${index + 1}. ${item.name}*\n Harga: ${item.price}\n\n`; 
                let numPrice = parseInt(item.price.replace(/[^0-9]/g, '')); 
                if(!isNaN(numPrice)) total += numPrice; 
            });
            
            let formatter = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 });
            let totalFormatted = formatter.format(total).replace('IDR', 'Rp');

            text += `*Total Pesanan: ${totalFormatted}*\n\nMohon informasikan detail kelanjutan prosesnya.`;
            
            const waNumber = formatWA(profile.whatsapp);
            if (!waNumber) {
                showToast('Gagal Checkout: Admin belum mengatur nomor WhatsApp!', 'error');
                return; // Batalkan proses checkout
            }
            
            window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`, '_blank');
            
            // Simpan Riwayat
            transactions.unshift({
                id: trxId,
                date: dateStr,
                items: [...cart],
                totalFormat: totalFormatted
            });

            cart = []; 
            saveData(); 
            document.getElementById('cartBadge').innerText = cart.length; 
            showToast('Pesanan berhasil dibuat & keranjang dibersihkan!', 'success'); 
            setTimeout(() => switchTab('transactions'), 1000);
        }

        function renderSliderImages() {

            if (!currentProductDetail || !currentProductDetail.images) return;
            
            const totalImages = currentProductDetail.images.length;

			imagesToRender.forEach((img, i) => { 
    	        track.innerHTML += `<div class="w-full h-full flex-shrink-0 cursor-zoom-in p-2 flex items-center justify-center" onclick="openImagePopup('${img}')"><img src="${img}" class="max-w-full max-h-full object-contain drop-shadow-xl rounded-lg"></div>`;

        function updateProductDots() {
            if(!currentProductDetail) return;
            const totalImages = currentProductDetail.images.length;
            const visualIndex = currentSlideIndex % totalImages; 
            const dots = document.querySelectorAll('.product-dot-ind');
            
            dots.forEach((dot, i) => {
                dot.className = i === visualIndex 
                    ? "product-dot-ind w-4 sm:w-5 h-1.5 sm:h-2 rounded-full bg-white transition-all" 
                    : "product-dot-ind w-1.5 sm:w-2 h-1.5 sm:h-2 rounded-full bg-white/50 transition-all";
            });
        }

        function nextSlide() { 
            if(!currentProductDetail || isProductSliding) return;
            const track = document.getElementById('sliderTrack');
            const totalOriginal = currentProductDetail.images.length;
            
            if (totalOriginal <= 1) return;

            isProductSliding = true;
            currentSlideIndex++;
            
            resetProductSlideInterval();

            track.style.transition = 'transform 500ms ease-out';
            track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            
            updateProductDots();

            if (currentSlideIndex === totalOriginal) {
                setTimeout(() => {
                    track.style.transition = 'none'; 
                    track.style.transform = `translateX(0%)`;
                    void track.offsetWidth; 
                    currentSlideIndex = 0; 
                    isProductSliding = false;
                }, 500);
            } else {
                setTimeout(() => { isProductSliding = false; }, 500);
            }
        }
        
        function prevSlide() { 
            if(!currentProductDetail || isProductSliding) return;

            if (totalOriginal <= 1) return;

            isProductSliding = true;
            resetProductSlideInterval();

                track.style.transition = 'none';
                currentSlideIndex = totalOriginal;
                track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        currentSlideIndex--;
                        track.style.transition = 'transform 500ms ease-out';
                        track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

        // --- FITUR ZOOM FOTO PRODUK ---
        let zoomScale = 1;
        let isDraggingImg = false;
        let startImgX, startImgY, transImgX = 0, transImgY = 0;
        let initPinchDist = null;
        let initPinchScale = 1;

        function openImagePopup(src) {
            const modal = document.getElementById('imagePopupModal');
            const img = document.getElementById('popupImage');
            img.src = src;
            
            zoomScale = 1; transImgX = 0; transImgY = 0;
            img.style.transform = `translate(0px, 0px) scale(1)`;
            img.style.transition = 'transform 0.3s ease-out';

        function closeImagePopup() {
            const modal = document.getElementById('imagePopupModal');
            const img = document.getElementById('popupImage');

        const thePopupImg = document.getElementById('popupImage');
        const thePopupModal = document.getElementById('imagePopupModal');

        thePopupModal.addEventListener('wheel', (e) => {
            if(thePopupModal.classList.contains('hidden')) return;
            e.preventDefault();
            thePopupImg.style.transition = 'none';
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            zoomScale = Math.max(1, Math.min(zoomScale + delta, 5)); 
            if(zoomScale === 1) { transImgX = 0; transImgY = 0; }
            thePopupImg.style.transform = `translate(${transImgX}px, ${transImgY}px) scale(${zoomScale})`;
        }, {passive: false});

        thePopupImg.addEventListener('mousedown', dragImgStart);
        thePopupImg.addEventListener('touchstart', dragImgStart, {passive: false});
        window.addEventListener('mousemove', dragImgMove);
        window.addEventListener('touchmove', dragImgMove, {passive: false});
        window.addEventListener('mouseup', dragImgEnd);
        window.addEventListener('touchend', dragImgEnd);

        function dragImgStart(e) {
            if(thePopupModal.classList.contains('hidden')) return;
            
            if(e.type === 'touchstart' && e.touches.length === 2) {
                initPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                initPinchScale = zoomScale;
                return;
            }
            
            if (zoomScale > 1) {
                isDraggingImg = true;
                thePopupImg.style.transition = 'none';
                startImgX = (e.type === 'mousedown' ? e.pageX : e.touches[0].pageX) - transImgX;
                startImgY = (e.type === 'mousedown' ? e.pageY : e.touches[0].pageY) - transImgY;
            }
        }

        function dragImgMove(e) {
            if(thePopupModal.classList.contains('hidden')) return;
            
            if(e.type === 'touchmove' && e.touches.length === 2) {
                e.preventDefault();
                const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                zoomScale = Math.max(1, Math.min(initPinchScale * (currentDist / initPinchDist), 5));
                if(zoomScale === 1) { transImgX = 0; transImgY = 0; }
                thePopupImg.style.transform = `translate(${transImgX}px, ${transImgY}px) scale(${zoomScale})`;
                return;
            }
            
            if(!isDraggingImg) return;
            e.preventDefault();
            transImgX = (e.type === 'mousemove' ? e.pageX : e.touches[0].pageX) - startImgX;
            transImgY = (e.type === 'mousemove' ? e.pageY : e.touches[0].pageY) - startImgY;
            thePopupImg.style.transform = `translate(${transImgX}px, ${transImgY}px) scale(${zoomScale})`;
        }

        function dragImgEnd() {
            isDraggingImg = false;
            initPinchDist = null;
        }

            const content = document.getElementById('bannerPopupContent');

                    ${!activeBannerData.images.length ? `<span class="bg-brand-500/10 text-brand-400 border border-brand-500/20 text-[9px] sm:text-[10px] font-bold px-3 py-1 rounded-full mb-3 inline-block uppercase tracking-wider">${b.label}</span>` : ''}
                    
                    <!-- PERBAIKAN: Font judul diperkecil menjadi text-base (HP) dan text-xl (PC) -->
                    <h2 class="text-base sm:text-xl font-bold text-white mb-3 leading-snug tracking-tight shrink-0">${b.title}</h2>
                    
                    <div class="w-10 sm:w-12 h-1 bg-brand-500 rounded-full mb-3 sm:mb-4 shrink-0"></div>
                    
                    <div class="max-h-32 sm:max-h-[30vh] overflow-y-auto pr-2 no-scrollbar">

            const modal = document.getElementById('bannerPopupModal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);

        }
        function removeFromCart(id) { cart = cart.filter(item => String(item.id) !== String(id)); document.getElementById('cartBadge').innerText = cart.length; saveData(); renderMainContent(); showToast('Dihapus dari keranjang', 'success'); }
        function toggleWishlistModal() { if(!currentProductDetail) return; const index = wishlist.findIndex(item => String(item.id) === String(currentProductDetail.id)); if(index > -1) { wishlist.splice(index, 1); showToast('Dihapus dari favorit', 'success'); } else { wishlist.push(currentProductDetail); showToast('Ditambahkan ke favorit', 'success'); } saveData(); updateWishlistModalBtn(); }
        function updateWishlistModalBtn() { const btn = document.getElementById('modalWishlistBtn'); btn.innerHTML = wishlist.some(item => String(item.id) === String(currentProductDetail.id)) ? '<i class="fa-solid fa-heart text-rose-500 text-base sm:text-lg"></i>' : '<i class="fa-regular fa-heart text-base sm:text-lg"></i>'; }
        
        function handleSearchHome(query) {
            isShowingAllProducts = true; 
            const cards = document.querySelectorAll('.product-card-item');
            cards.forEach(card => { card.style.display = card.querySelector('h4').innerText.toLowerCase().includes(query.toLowerCase()) ? "flex" : "none"; });
            document.querySelectorAll('.show-more-card').forEach(btn => btn.style.display = 'none');
        }

        // Init Aplikasi
        document.getElementById('cartBadge').innerText = cart.length;
		updateActiveBanners();
        applyAppBranding(); 
        updateAuthButton();
        renderBottomNav();
        renderMainContent();
        
        if (currentTab === 'home') setTimeout(initBannerSlider, 100);
    </script>
</body>
</html>
